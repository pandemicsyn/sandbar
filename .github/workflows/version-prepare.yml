name: Prepare package versions
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: version-prepare
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check pending changesets
        run: bunx changeset status --output /tmp/sandbar-changeset-status.json
      - name: Prepare version branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/assert-pending-changesets.mjs /tmp/sandbar-changeset-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c codex/version-packages
          bun run version:packages
          bun run release:refresh-lock
          bun run release:check-manifests
          git add .changeset packages bun.lock
          if git diff --cached --quiet; then
            echo 'No version changes were generated.' >&2
            exit 1
          fi
          git commit -m 'chore: version packages'
          git push --force-with-lease origin HEAD:refs/heads/codex/version-packages
          echo 'Version branch ready: codex/version-packages. Independent review is required before opening its PR.' >> "$GITHUB_STEP_SUMMARY"
