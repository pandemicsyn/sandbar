name: Release npm packages
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Branch, tag, or commit to validate. Real release requires exact v<version> tag.
        required: true
        default: main
        type: string
      npm_tag:
        description: auto selects next for prereleases and latest for stable versions.
        required: true
        default: auto
        type: choice
        options: [auto, next, latest]
      dry_run:
        description: Validate and pack without publishing.
        required: true
        default: true
        type: boolean
concurrency:
  group: release-npm
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref }}
      - name: Validate real release ref
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          if [ "${DRY_RUN}" = false ]; then
            [[ "${RELEASE_REF}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || exit 1
            test "$(git rev-parse "refs/tags/${RELEASE_REF}^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - name: Record qualified commit
        id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
          run_install: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate release manifests
        run: bun run release:check-manifests
      - name: Lint and format
        run: bun run lint && bun run format:check
      - name: Typecheck and test
        run: bun run check && bun run test
      - name: Build and qualify packed consumers
        run: bun run build && bun run package:smoke
      - name: Qualify documentation
        run: bun run docs:check
      - name: Pack qualified checkout
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_ARTIFACTS: ${{ runner.temp }}/sandbar-qualified
        run: bun scripts/release.mjs dry-run
      - name: Qualify npm, pnpm and Bun installers
        env:
          RELEASE_ARTIFACTS: ${{ runner.temp }}/sandbar-qualified
        run: bun scripts/check-installers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sandbar-qualified-release
          path: ${{ runner.temp }}/sandbar-qualified
          if-no-files-found: error
  publish:
    if: inputs.dry_run == false
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm 11 CLI
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build exact release packages
        run: bun run build:packages
      - uses: actions/download-artifact@v4
        with:
          name: sandbar-qualified-release
          path: ${{ runner.temp }}/sandbar-qualified
      - name: Publish qualified release
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_APPROVED: "true"
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACTS: ${{ runner.temp }}/sandbar-publish
          RELEASE_QUALIFIED_ARTIFACTS: ${{ runner.temp }}/sandbar-qualified
        run: bun scripts/release.mjs publish
