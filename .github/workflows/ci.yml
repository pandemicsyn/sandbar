name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packed: ${{ steps.scope.outputs.packed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Select packed consumer coverage
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'packed=true' >> "$GITHUB_OUTPUT"
          else
            # Include both sides of renames so moving a packaging input out still qualifies.
            git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            if grep -Eq \
              -e '(^bun.lock$|^\.github/workflows/|^\.changeset/(config\.json|pre\.json)$|^scripts/)' \
              -e '(^|/)(package.json|tsconfig[^/]*\.json|build-assets\.ts|flatten-declarations\.mjs|\.npmignore|\.gitignore)$' \
              -e '^packages/([^/]+|providers/[^/]+)/src/(index|client|server|adapter|portable|testing|daytona|e2b)\.ts$' \
              -e '^packages/([^/]+|providers/[^/]+)/assets/' \
              -e '^packages/sdk-qualification/.*\.(ts|mjs|json)$' \
              -e '^apps/docs/examples/recovery-outcomes\.ts$' \
              "$RUNNER_TEMP/changed-files"; then
              echo 'packed=true' >> "$GITHUB_OUTPUT"
            else
              test "$?" -eq 1
              echo 'packed=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - parallel:
          - name: Lint
            run: bun run lint
          - name: Check formatting
            run: bun run format:check
          - name: Build shared packages once, in dependency order
            run: bun run build:packages
      - run: bun run check:built
      - name: Archive fresh outputs for this commit and run
        run: |
          shopt -s nullglob
          tar -czf "$RUNNER_TEMP/sandbar-build.tar.gz" packages/*/dist packages/providers/*/dist
      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}/sandbar-build.tar.gz
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  offline:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/sandbar-build.tar.gz"
      - name: SDK, adapter and offline provider contracts
        run: bun run test:sdk:built
  packed:
    needs: build
    if: needs.build.outputs.packed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/sandbar-build.tar.gz"
      - parallel:
          - name: Packed Node and Bun consumers
            run: bun run package:smoke:built
          - name: Local OpenTelemetry, Sentry and Datadog fixtures
            run: bun run observability:check
  docs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/sandbar-build.tar.gz"
      - name: Documentation checks, generated references, site and examples
        run: bun run docs:check:built
  verify:
    if: always()
    needs: [build, offline, packed, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require selected validation jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .build.result == "success" and
            .offline.result == "success" and
            .docs.result == "success" and
            (if .build.outputs.packed == "false" then
              .packed.result == "skipped"
            else
              .build.outputs.packed == "true" and .packed.result == "success"
            end)
          '
