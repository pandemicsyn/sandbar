name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Select release rehearsal coverage
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            if grep -Eq '(^package.json$|^bun.lock$|^tsconfig.json$|^\.github/|^\.changeset/(config\.json|pre\.json)$|^scripts/|(^|/)(package.json|tsconfig[^/]*\.json|build-assets.ts|flatten-declarations\.mjs|\.npmignore)$)|^apps/web/(vite\.config\.[^/]+|index\.html)$' "$RUNNER_TEMP/changed-files"; then
              echo 'release=true' >> "$GITHUB_OUTPUT"
            else
              test "$?" -eq 1
              echo 'release=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: bun run lint && bun run format:check
      - name: Build shared packages once, in dependency order
        run: bun run build:packages
      - run: bun run check:built
      - name: Build server
        run: bun run --cwd apps/server build
      - name: Archive fresh outputs for this commit and run
        run: |
          shopt -s nullglob
          tar -czf "$RUNNER_TEMP/sandbar-build.tar.gz" packages/*/dist packages/providers/*/dist apps/server/dist apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}/sandbar-build.tar.gz
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  offline:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/sandbar-build.tar.gz"
      - name: SDK, adapter and offline provider contracts
        run: bun run test:sdk:built
  service:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/sandbar-build.tar.gz"
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Existing service, store and management UI regressions
        env:
          SANDBAR_TEST_BUILT_WEB: "true"
        run: bun run test:service:built
  packed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/sandbar-build.tar.gz"
      - name: Packed Node and Bun consumers
        run: bun run package:smoke:built
      - name: Local OpenTelemetry, Sentry and Datadog fixtures
        run: bun run observability:check
      - uses: pnpm/action-setup@v6
        if: needs.build.outputs.release == 'true'
        with:
          version: 10.18.3
          run_install: false
      - name: Stable and prerelease version and installer rehearsal
        if: needs.build.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:fixture
  docs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/sandbar-build.tar.gz"
      - name: Documentation checks, generated references, site and examples
        run: bun run docs:check:built
  verify:
    if: always()
    needs: [build, offline, service, packed, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
